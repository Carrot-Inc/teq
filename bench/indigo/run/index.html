<!DOCTYPE html>
<!-- The sandbox game's page as indigo-plugin writes it (templates/HtmlTemplate.scala, the sandbox's options: its
     title, a black background), launching the game from teq's build, served beside it as out/: an ES module
     whose export is the game's @JSExportTopLevel("IndigoGame") object, where the plugin's page reads a global. -->
<html>
  <head>
    <meta charset="UTF-8">
    <title>Sandbox</title>
    <style>
      body {
        padding:0px;
        margin:0px;
        overflow-x: hidden;
        overflow-y: hidden;
        background-color: black;
      }
      #indigo-container {
        display: flex;
        align-items: center;
        justify-content: center;
        padding:0px;
        margin:0px;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- This div's id is hardcoded, and several parts of this reference implementation look for it. -->
    <div id="indigo-container"></div>
    <script type="module">
      import { IndigoGame } from "./out/main.mjs";
      IndigoGame.launch("indigo-container", {"width": window.innerWidth.toString(), "height": window.innerHeight.toString()});
    </script>
  </body>
</html>
