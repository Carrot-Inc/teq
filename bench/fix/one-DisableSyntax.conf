# Every shipped rule, DisableSyntax with every setting on and a regex (fix-verb's measurement, recreated).
rules = [DisableSyntax]
DisableSyntax.keywords = [implicit, lazy, macro, forSome, do]
DisableSyntax.noVars = true
DisableSyntax.noThrows = true
DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noWhileLoops = true
DisableSyntax.noAsInstanceOf = true
DisableSyntax.noIsInstanceOf = true
DisableSyntax.noSemicolons = true
DisableSyntax.noTabs = true
DisableSyntax.noXml = true
DisableSyntax.noCovariantTypes = true
DisableSyntax.noContravariantTypes = true
DisableSyntax.noDefaultArgs = true
DisableSyntax.noValInAbstract = true
DisableSyntax.noImplicitObject = true
DisableSyntax.noImplicitConversion = true
DisableSyntax.noFinalVal = true
DisableSyntax.noFinalize = true
DisableSyntax.noValPatterns = true
DisableSyntax.noUniversalEquality = true
DisableSyntax.regex = [{ id = mutableImport, pattern = "(?m)^import scala\\.collection\\.mutable\\.", message = "no mutable imports" }]
lint.error.includes = ".*"
