# The application's settings of the shipped rules: DisableSyntax's noVars, noFinalize, noWhileLoops, noReturns and one
# multiline regex over imports (a pattern of this file's own), every lint an error.
rules = [DisableSyntax, NoUnusedImports, EmptyCollectionsUnified, TypelevelAs, CatsImplicitsImport]
lint.error.includes = ".*"
DisableSyntax.regex = [{ id = "union-import", pattern = "(?m)^import scala\\.collection\\.(\\||\\{[^}]*\\|)", message = "write the union type directly" }]
DisableSyntax.noVars = true
DisableSyntax.noFinalize = true
DisableSyntax.noWhileLoops = true
DisableSyntax.noReturns = true
