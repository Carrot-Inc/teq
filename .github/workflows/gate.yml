# The gate of tests/all.sh, one job per group of suites so that each stays within a bound. The
# budget suites skip here: their numbers belong to the machine that recorded them. Every action is
# pinned by its commit (the release workflow's where it takes the same), and each job's token reads
# the repository alone. A group whose suites read jars has every jar tests/support/jars.sh names
# before they run: the Maven ones restored from the cache that file keys, a miss fetched from Maven
# Central (bench/actions/jars.sh fetch), the ones it builds built with scala-cli (jars_warm); a jar
# neither has fails the job, so that no suite counts a case of a missing jar as passed.
name: gate
on:
  push:
    branches: [master]
  pull_request:
permissions: {}
env:
  CARGO_TERM_COLOR: always
  # The scala/scala3 commit whose tests/run, tests/neg and tests/pos the harnesses walk; the
  # baselines in tests/scala3/*.txt and tests/scala3-typing/expected.txt were recorded on it.
  SCALA3_REF: 7414c83e175a27726eb3f9b18d4185d9c470d884
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release
      - run: tests/rust-warnings.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teq
          path: target/release/teq
          if-no-files-found: error
  suites:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            suites: cases errors parser interop dce size split fold
            minutes: 35
            jars: true
          - group: watch
            suites: split-watch
            minutes: 45
            jars: true
          - group: interp
            suites: interp
            minutes: 35
            jars: true
          - group: jvm
            suites: jvm
            minutes: 40
            jars: true
          - group: libraries
            suites: tasty classfile classpath stdlib
            minutes: 35
            jars: true
          - group: scala3
            suites: scala3-run scala3-interp scala3-macros scala3-macros-interp scala3-typing
            minutes: 30
            scala3: true
    name: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: teq
          path: target/release
      - run: chmod +x target/release/teq
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - if: matrix.jars
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.jars
        uses: coursier/setup-action@039f736548afa5411c1382f40a5bd9c2d30e0383 # v1.3.9
        with:
          apps: scala-cli
      - if: matrix.jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/coursier/v1
          key: jars-${{ hashFiles('tests/support/jars.sh') }}
      - if: matrix.jars
        run: |
          export COURSIER_CACHE="$HOME/.cache/coursier/v1"
          timeout 900 bench/actions/jars.sh fetch
          timeout 1200 bash -c '. tests/support/jars.sh && jars_warm'
      - if: matrix.scala3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/teq-ref/scala3
          key: scala3-${{ env.SCALA3_REF }}
      - if: matrix.scala3
        run: |
          if [ ! -d ~/teq-ref/scala3/tests ]; then
            git init -q ~/teq-ref/scala3
            cd ~/teq-ref/scala3
            git remote add origin https://github.com/scala/scala3.git
            git sparse-checkout set tests
            git fetch -q --depth 1 origin "$SCALA3_REF"
            git checkout -q FETCH_HEAD
          fi
      - run: |
          export COURSIER_CACHE="$HOME/.cache/coursier/v1"
          export SCALA3="$HOME/teq-ref/scala3"
          tests/all.sh ${{ matrix.suites }}
