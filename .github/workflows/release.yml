          persist-credentials: false
      - run: git config --global --add safe.directory '*'
      - if: needs.admit.outputs.mode == 'fresh'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged
          path: out/actions
      - if: needs.admit.outputs.mode == 'resume'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged
          path: out/actions
          run-id: ${{ needs.admit.outputs.source_run }}
          github-token: ${{ github.token }}
      - id: record
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ship-record
          path: out/ship
      - if: steps.record.outcome != 'success' && needs.admit.outputs.mode == 'resume'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ship-record
          path: out/ship
          run-id: ${{ needs.admit.outputs.source_run }}
          github-token: ${{ github.token }}
      - run: mkdir -p out/actions/staged && timeout 300 tar -xf out/actions/staged.tar -C out/actions/staged
      - run: timeout 3900 bench/actions/release-step.sh publish smoke-public
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ship-record
          path: out/ship/*/record.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90

  # The pin on the release's commit (bench/release.sh --pin --commit), committed by the Actions bot and pushed onto
  # master without force.
  pin:
    needs: [admit, smoke-public]
    if: "!cancelled() && needs.smoke-public.result == 'success'"
    runs-on: ${{ vars.TEQ_RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 110
    environment: release
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      packages: read
      actions: read
    container:
      image: ${{ needs.admit.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      TEQ_VERSION: ${{ needs.admit.outputs.version }}
      TEQ_COMMIT: ${{ needs.admit.outputs.commit }}
      TEQ_DRY: ${{ needs.admit.outputs.dry }}
      TEQ_RUN: ${{ needs.admit.outputs.source_run }}
      TEQ_MODE: ${{ needs.admit.outputs.mode }}
      TEQ_IMAGE: ${{ needs.admit.outputs.image }}
      TEQ_PLUGIN: ${{ needs.admit.outputs.plugin }}
      TEQ_PLUGIN_PUBLISH: ${{ needs.admit.outputs.plugin_publish }}
      TEQ_STAGED: out/actions/staged
      COURSIER_CACHE: /github/home/.cache/coursier/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory '*'
      - id: record
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ship-record
          path: out/ship
      - if: steps.record.outcome != 'success' && needs.admit.outputs.mode == 'resume'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ship-record
          path: out/ship
          run-id: ${{ needs.admit.outputs.source_run }}
          github-token: ${{ github.token }}
      - id: pin
        run: timeout 5400 bench/actions/release-step.sh pin
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ship-record
          path: out/ship/*/record.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90

  # The site of the pinned commit, when the environment holds its deploy's secrets.
  site:
    needs: [admit, pin]
    if: "!cancelled() && needs.pin.result == 'success'"
    runs-on: ${{ vars.TEQ_RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 70
    environment: release
    permissions:
      contents: read
      actions: read
    env:
      TEQ_VERSION: ${{ needs.admit.outputs.version }}
      TEQ_COMMIT: ${{ needs.admit.outputs.commit }}
      TEQ_DRY: ${{ needs.admit.outputs.dry }}
      TEQ_RUN: ${{ needs.admit.outputs.source_run }}
      TEQ_MODE: ${{ needs.admit.outputs.mode }}
      TEQ_IMAGE: ${{ needs.admit.outputs.image }}
      TEQ_PLUGIN: ${{ needs.admit.outputs.plugin }}
      TEQ_PLUGIN_PUBLISH: ${{ needs.admit.outputs.plugin_publish }}
      TEQ_STAGED: out/actions/staged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pin.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - id: record
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ship-record
          path: out/ship
      - if: steps.record.outcome != 'success' && needs.admit.outputs.mode == 'resume'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ship-record
          path: out/ship
          run-id: ${{ needs.admit.outputs.source_run }}
          github-token: ${{ github.token }}
      - run: timeout 2800 bench/actions/release-step.sh site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ship-record
          path: out/ship/*/record.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90

  # After a failure: what stands and what the next run must do (bench/actions/release-step.sh conclude), the draft
  # abandoned when nothing irreversible was done and the failing step did not abandon it.
  conclude:
    needs: [admit, profiles, train-arm, build-linux-x64, reference, build-windows, build-macos-arm64, build-macos-x64, build-linux-arm64,
      suite-linux-arm64, stage, qualify-linux-x64, qualify-linux-arm64, qualify-macos-arm64, qualify-macos-x64, qualify-windows, draft, smoke-local, central, central-promote, central-readback, publish, smoke-public, pin, site]
    if: "failure() && needs.admit.outputs.go == 'true'"
    runs-on: ${{ vars.TEQ_RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 50
    environment: release
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TEQ_VERSION: ${{ needs.admit.outputs.version }}
      TEQ_COMMIT: ${{ needs.admit.outputs.commit }}
      TEQ_DRY: ${{ needs.admit.outputs.dry }}
      TEQ_RUN: ${{ needs.admit.outputs.source_run }}
      TEQ_MODE: ${{ needs.admit.outputs.mode }}
      TEQ_IMAGE: ${{ needs.admit.outputs.image }}
      TEQ_PLUGIN: ${{ needs.admit.outputs.plugin }}
      TEQ_PLUGIN_PUBLISH: ${{ needs.admit.outputs.plugin_publish }}
      TEQ_STAGED: out/actions/staged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - id: record
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ship-record
          path: out/ship
      - if: steps.record.outcome != 'success' && needs.admit.outputs.mode == 'resume'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ship-record
          path: out/ship
          run-id: ${{ needs.admit.outputs.source_run }}
          github-token: ${{ github.token }}
      - id: central-record
        if: needs.admit.outputs.plugin_publish == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: central-record
          path: out/central
      - if: needs.admit.outputs.plugin_publish == 'true' && steps.central-record.outcome != 'success' && needs.admit.outputs.mode == 'resume'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: central-record
          path: out/central
          run-id: ${{ needs.admit.outputs.source_run }}
          github-token: ${{ github.token }}
      - name: The Central credentials
        if: needs.admit.outputs.plugin_publish == 'true'
        continue-on-error: true
        run: timeout 120 bench/actions/credentials.sh write "$RUNNER_TEMP/teq-credentials" >> "$GITHUB_ENV"
        env:
          CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - run: timeout 1500 bench/actions/release-step.sh conclude
      - if: always()
        run: timeout 120 bench/actions/credentials.sh remove "$RUNNER_TEMP/teq-credentials"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ship-record
          path: out/ship/*/record.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90
